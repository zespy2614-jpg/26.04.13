name: Build APK

on:
  push:
    branches:
      - claude/build-task-reminder-apk-kP4Xv
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Lint (non-blocking)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-v${{ env.BUILD_NUMBER }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/JitjiTodo-v${BUILD_NUMBER}.apk"

      - name: Verify APK contents
        run: |
          set -e
          APK="artifacts/JitjiTodo-v${BUILD_NUMBER}.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools"
          AAPT=$(find "$BUILD_TOOLS" -name aapt2 | sort -r | head -n1)
          echo "Using $AAPT"

          DUMP=$("$AAPT" dump badging "$APK")
          echo "--- badging ---"
          echo "$DUMP" | head -30

          fail=0
          check() {
            if echo "$DUMP" | grep -qF "$1"; then
              echo "✓ $2"
            else
              echo "✗ MISSING: $2 ($1)"
              fail=1
            fi
          }

          check "package: name='com.jitji.todo'" "package name"
          check "uses-permission: name='android.permission.POST_NOTIFICATIONS'" "POST_NOTIFICATIONS"
          check "uses-permission: name='android.permission.FOREGROUND_SERVICE'" "FOREGROUND_SERVICE"
          check "uses-permission: name='android.permission.FOREGROUND_SERVICE_SPECIAL_USE'" "FGS special use"
          check "uses-permission: name='android.permission.SCHEDULE_EXACT_ALARM'" "SCHEDULE_EXACT_ALARM"
          check "uses-permission: name='android.permission.RECEIVE_BOOT_COMPLETED'" "RECEIVE_BOOT_COMPLETED"
          check "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" "REQUEST_INSTALL_PACKAGES"
          check "uses-permission: name='android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS'" "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
          check "uses-permission: name='android.permission.INTERNET'" "INTERNET (for update)"

          echo "--- manifest xmltree ---"
          MAN=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)
          echo "$MAN" | grep -E 'activity|service|receiver|provider' | head -40

          checkm() {
            if echo "$MAN" | grep -qF "$1"; then
              echo "✓ $2"
            else
              echo "✗ MISSING in manifest: $2"
              fail=1
            fi
          }
          checkm "LockscreenService" "LockscreenService declared"
          checkm "RestartReceiver" "RestartReceiver declared"
          checkm "BootReceiver" "BootReceiver declared"
          checkm "ReminderReceiver" "ReminderReceiver declared"
          checkm "FileProvider" "FileProvider declared"
          checkm "foregroundServiceType" "foregroundServiceType set"

          echo "--- signing fingerprint ---"
          KEYTOOL_OUT=$(keytool -printcert -jarfile "$APK" 2>/dev/null | head -40 || true)
          echo "$KEYTOOL_OUT" | grep -i 'sha-256\|owner' || true

          if [ $fail -ne 0 ]; then
            echo "APK verification FAILED"
            exit 1
          fi
          echo "All APK checks passed ✓"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JitjiTodo-v${{ env.BUILD_NUMBER }}
          path: artifacts/JitjiTodo-v${{ env.BUILD_NUMBER }}.apk
          if-no-files-found: error

      - name: Create or update release
        if: github.ref == 'refs/heads/claude/build-task-reminder-apk-kP4Xv' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: JitjiTodo build (${{ github.ref_name }}) v${{ env.BUILD_NUMBER }}
          body: |
            자동 빌드 - 빌드 번호 v${{ env.BUILD_NUMBER }}
            커밋: ${{ github.sha }}
          files: artifacts/JitjiTodo-v${{ env.BUILD_NUMBER }}.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
